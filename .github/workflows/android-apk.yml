name: Build and publish Android TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LampaLiteTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LampaLiteTV-debug.apk
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev LampaLiteTV-debug.apk --clobber
          else
            gh release create dev LampaLiteTV-debug.apk --target "$GITHUB_SHA" --title "Lampa Lite TV (development)" --notes "Тестовые сборки из ветки main. Возможны ошибки." --prerelease
          fi

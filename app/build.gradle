plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lampalitetv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.lampalitetv'
        minSdk 26
        targetSdk 28
        versionCode 25
        versionName '1.5.19-c645'
    }

    lint {
        // This APK is sideloaded on Android TV, not submitted to Google Play.
        // Keep target-API policy visible as a warning without changing TV behavior.
        warning 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
